<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contact</title>
</head>
<body>
    <header class="contact-header">
        <nav class="contact-nav">
            <h3><a href="index.html">Home</a></h3>
            <h3><a href="cv.html">Resume</a></h3>
        </nav>
        <h4 class="github-link"><a class="github-href" href="https://github.com/omarmouttalie" target="_blank">Github Link</a></h4>
    </header>
    <h1 class="contact-heading">Contact Mini-Site</h1>
    <main>
        <form class="for" action="#">
            <fieldset>
                <legend>Form</legend>
                <label for="name">Name:</label>
                <input type="text" id="name" required> <br> <br>
                <label for="email">E-mail:</label>
                <input type="email" id="email" required> <br> <br>
                <label for="Message">Message:</label>
                <textarea name="Message" id="Message" required></textarea> <br> <br>
                <button type="submit">SUBMIT</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
